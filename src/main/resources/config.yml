settings:
  enabled: true
  announce-events: true
  min-online-players: 1
  require-target-in-survival: true
  cleanup-event-mobs-on-disable: true
  cleanup-event-mobs-on-reload: false
  clear-vanilla-drops-from-event-mobs: true
  despawn-after-seconds: 1800
  despawn:
    when-no-players-nearby:
      enabled: true
      radius: 200
      delay-seconds: 180
    target-bound-when-target-unavailable:
      enabled: true
      delay-seconds: 5
      combat-grace-seconds: 5
      behaviors:
        - hunter_focus
      events:
        - assassination_attempt
  safe-radius-from-world-spawn: 64
  disabled-worlds: []
  spawn-safety:
    require-loaded-chunk: true
    max-event-mobs-in-radius: 24
    event-mob-density-radius: 48
    min-distance-from-online-bed-spawns: 32
    disabled-biomes:
      - DEEP_DARK
      - MUSHROOM_FIELDS
  gear-scaling:
    enabled: true
    days-per-stage: 4
    max-stage: 24
    random-stage-variance: 1
    stage-override: -1
  world-scaling:
    enabled: true
    days-per-stage: 4
    max-stage: 24
    stage-override: -1
    stats:
      health-bonus-per-stage: 0.0125
      max-health-bonus: 0.30
      attack-damage-bonus-per-stage: 0.01
      max-attack-damage-bonus: 0.24
      armor-bonus-per-stage: 0.008
      max-armor-bonus: 0.18
      movement-speed-bonus-per-stage: 0.002
      max-movement-speed-bonus: 0.05
      follow-range-bonus-per-stage: 0.006
      max-follow-range-bonus: 0.15
    event-budget:
      bonus-per-stage: 0.015
      max-bonus: 0.35
    mob-count:
      extra-chance-per-stage: 0.006
      max-extra-chance: 0.15
      max-extra-mobs-per-class: 1
    loot:
      chance-bonus-per-stage: 0.003
      max-chance-bonus: 0.08
      extra-amount-chance-per-stage: 0.004
      max-extra-amount-chance: 0.10
      max-extra-amount: 1
  interval-seconds:
    min: 1800
    max: 7200

messages:
  prefix: '&8[&cEvents&8]&r '
  event-started: '&7Event &c{event}&7 appeared near &e{player}&7. &8({x}, {y}, {z})'
  forced-event-started: '&aForced event &e{event}&a near &e{player}&a.'
  no-valid-players: '&cNo valid players are online.'
  no-enabled-events: '&cNo enabled events are configured.'

anchor-events:
  enemy_camp:
    banner-material: RED_BANNER
    sub-event-interval-seconds: 1800
    sub-event-radius: 1000
    no-target-timeout-seconds: 1800
    banner-destroyed-despawn-seconds: 1800
    guard-leash-radius: 28
    guard-awake-radius: 48
    sub-events:
      - patrol
      - ambush
      - explosive_ambush
      - hunter_event
  cursed_ritual:
    banner-material: PURPLE_BANNER
    sub-event-interval-seconds: 1800
    sub-event-radius: 1000
    no-target-timeout-seconds: 1800
    banner-destroyed-despawn-seconds: 1800
    guard-leash-radius: 24
    guard-awake-radius: 48
    sub-events:
      - patrol
      - ambush
      - explosive_ambush
      - hunter_event

